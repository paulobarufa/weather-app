<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DondeWeather</title>
</head>
<body>
    <div class="header">
        <div class="logo">DondeWeather.</div>
        <input type="text" name="search" id="search" class="search-bar">
    </div>
    <div class="main-content">
        <div class="content-wrapper">
            <h1 class="location-title">Location</h1>
            <div class="day-bar"></div>
            <div class="content">
                <div class="info-panel">
                    <h2 class="content-date">Thursday whatever day</h2>
                    <p class="content-description">Rainy, chance of clouds, probably terrible</p>
                </div>
                <div class="icon-panel">
                    <img src="https://raw.githubusercontent.com/visualcrossing/WeatherIcons/58c79610addf3d4d91471abbb95b05e96fb43019/SVG/2nd%20Set%20-%20Color/rain.svg" alt="Weather icon" class="large-icon">
                </div>
                <div class="temp-panel">

                </div>
                <div class="feels-panel">

                </div>
            </div>
        </div>
    </div>
    <div class="footer">
        Maulo Patos enterprises 2025
    </div>
</body>
</html>
