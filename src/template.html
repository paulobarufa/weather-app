<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DondeWeather</title>
</head>
<body>
    <div class="header">
        <div class="logo">DondeWeather.</div>
        <input type="text" name="search" id="search" class="search-bar">
    </div>
    <div class="main-content">
        <div class="content-wrapper">
            <h1 class="location-title">Location</h1>
            <div class="day-bar">
                <div class="day-box active">
                    <p class="box-date">Tues 31</p>
                    <img src="https://raw.githubusercontent.com/visualcrossing/WeatherIcons/58c79610addf3d4d91471abbb95b05e96fb43019/SVG/2nd%20Set%20-%20Color/rain.svg" alt="Box icon" class="box-icon">
                    <p class="box-temp"><strong>31</strong> / 15</p>
                </div>
                <div class="day-box"></div>
                <div class="day-box"></div>
                <div class="day-box"></div>
                <div class="day-box"></div>
                <div class="day-box"></div>
                <div class="day-box"></div>
            </div>
            <div class="content">
                <div class="info-panel">
                    <h2 class="content-date">Thursday whatever day</h2>
                    <p class="content-description">Rainy, chance of clouds, probably terrible</p>
                </div>
                <div class="icon-panel">
                    <img src="https://raw.githubusercontent.com/visualcrossing/WeatherIcons/58c79610addf3d4d91471abbb95b05e96fb43019/SVG/2nd%20Set%20-%20Color/rain.svg" alt="Weather icon" class="large-icon">
                    <p class="icon-conditions">Slight chance of rain Slight chance of rain</p>
                </div>
                <div class="temp-panel">
                    <h3 class="temp-title">Temperature</h3>
                    <div class="temp-highs">
                        <p class="temp-text">DAILY HIGH</p>
                        <p class="temp-temp">35</p>
                    </div>
                    <div class="temp-lows">
                        <p class="temp-text">DAILY LOW</p>
                        <p class="temp-temp">15</p>
                    </div>
                </div>
                <div class="feels-panel">
                    <h3 class="temp-title">Feels Like</h3>
                    <div class="temp-highs">
                        <p class="temp-text">DAILY HIGH</p>
                        <p class="temp-temp">35</p>
                    </div>
                    <div class="temp-lows">
                        <p class="temp-text">DAILY LOW</p>
                        <p class="temp-temp">15</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="footer">
        Maulo Patos enterprises &copy; 2025
    </div>
</body>
</html>
